[workspace]
members = [".", "fixtures/mock-claude", "src-tauri"]

[package]
name = "galvolite"
version = "0.1.0"
edition = "2021"
description = "Solo continuity engine for Claude Code — ritual engine CLI"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "uuid", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
portable-pty = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
once_cell = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower = "0.5"
futures-util = "0.3.32"
vt100 = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
subtle = "2"
sha2 = "0.10"
hex  = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
urlencoding = "2"
tokio-tungstenite = "0.21"
mockito = "1"

[[bin]]
name = "galvolite"
path = "src/main.rs"

[[bin]]
name = "galvolite-hook"
path = "src/bin/galvolite-hook.rs"

[lib]
name = "galvolite"
path = "src/lib.rs"
